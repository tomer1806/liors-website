<div class="a11y" id="a11y">
    <button class="a11y__toggle" id="a11yToggle" type="button" aria-label="תפריט נגישות" aria-expanded="false" aria-controls="a11yPanel">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="4.2" r="2.1"/><path d="M19.6 8.1c-2.5.7-5 1-7.6 1s-5.1-.3-7.6-1l-.5 1.8c2 .6 4 .9 6.1 1v3.3l-2.3 7.2 1.8.6L12 15.6l2.5 6.4 1.8-.6-2.3-7.2v-3.3c2.1-.1 4.1-.4 6.1-1z"/></svg>
    </button>

    <div class="a11y__panel" id="a11yPanel" role="dialog" aria-modal="false" aria-labelledby="a11yTitle" tabindex="-1" hidden>
        <div class="a11y__head">
            <h2 class="a11y__title" id="a11yTitle">נגישות</h2>
            <button class="a11y__close" type="button" aria-label="סגירת תפריט הנגישות">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
            </button>
        </div>

        <div role="group" aria-labelledby="a11yTextLabel">
            <span class="a11y__label" id="a11yTextLabel">גודל טקסט</span>
            <div class="a11y__stepper">
                <button type="button" data-a11y="text-down" aria-label="הקטנת טקסט">א−</button>
                <output class="a11y__value" id="a11yTextValue" aria-live="polite">100%</output>
                <button type="button" data-a11y="text-up" aria-label="הגדלת טקסט">א+</button>
            </div>
        </div>

        <div class="a11y__grid">
            <button type="button" class="a11y__opt" data-a11y-flag="contrast" aria-pressed="false">ניגודיות גבוהה</button>
            <button type="button" class="a11y__opt" data-a11y-flag="links" aria-pressed="false">הדגשת קישורים</button>
            <button type="button" class="a11y__opt" data-a11y-flag="spacing" aria-pressed="false">ריווח טקסט</button>
            <button type="button" class="a11y__opt" data-a11y-flag="motion" aria-pressed="false">עצירת אנימציות</button>
        </div>

        <div id="a11ySpeech">
            <button type="button" class="a11y__opt a11y__opt--wide" id="a11yRead" aria-pressed="false">הקראת העמוד</button>
            <p class="a11y__hint" id="a11yReadHint">סימון טקסט בעמוד לפני הלחיצה יקריא רק אותו.</p>
        </div>

        <div class="a11y__foot">
            <button type="button" class="a11y__reset" data-a11y="reset">איפוס הגדרות</button>
            <a class="a11y__link" href="accessibility.html">הצהרת נגישות</a>
        </div>
    </div>
</div>
