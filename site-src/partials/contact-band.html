<section class="band">
    <div class="band__inner">
        <div class="band__item">
            <span class="band__label">טלפון</span>
            <a class="band__value" href="{{phoneHref}}">{{phone}}</a>
        </div>
        <div class="band__item">
            <span class="band__label">דוא״ל</span>
            <a class="band__value" href="mailto:{{email}}">{{email}}</a>
        </div>
        <div class="band__item">
            <span class="band__label">כתובת</span>
            <span class="band__value">{{addressShort}}</span>
        </div>
        <div class="band__item">
            <span class="band__label">שעות פעילות</span>
            <span class="band__value">{{hours}}</span>
        </div>
    </div>
</section>
