<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Tab icon: the LR monogram from the header (logo-mark.svg), same geometry, white on the
       site ink colour. Strokes are heavier than the header's on purpose: at 3 and 4.5 units they
       would be under half a pixel in a 32px tab and disappear. -->
